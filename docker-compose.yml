services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ps_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong!password}
      POSTGRES_DB: ${POSTGRES_DB:-ps_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10
  
  migrate:
    image: criptofile-app:local
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    entrypoint: ["uv", "run", "alembic"]
    command: ["upgrade", "head"]
    restart: "no"

  app:
    image: criptofile-app:local
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      # workspace/ (chaves privadas), .audit_key e app.log precisam sobreviver
      # entre execuções: cada `docker compose run --rm` cria um container novo.
      CRIPTOFILE_HOME: /data
    volumes:
      - ./arquivos:/arquivos
      - criptofile_data:/data

  dbgate:
    image: dbgate/dbgate:alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONNECTIONS: pg1
      LABEL_pg1: Postgres
      ENGINE_pg1: postgres@dbgate-plugin-postgres
      SERVER_pg1: db
      USER_pg1: ${POSTGRES_USER:-ps_user}
      PASSWORD_pg1: ${POSTGRES_PASSWORD:-strong!password}
      DATABASE_pg1: ${POSTGRES_DB:-ps_db}
    ports:
      - "${DBGATE_PORT:-3005}:3000"

volumes:
  postgres_data:
  criptofile_data: